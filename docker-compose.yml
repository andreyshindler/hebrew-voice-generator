services:
  hebrew-voice:
    build: .
    image: hebrew-voice:latest
    container_name: hebrew-voice
    restart: unless-stopped

    # Bound to localhost only - nginx on the host terminates TLS and proxies
    # /voice-gen/ to this port. Never publish it on 0.0.0.0.
    #
    # Set HV_PUBLISH_PORT in .env when 8080 is already in use on the host;
    # only the left-hand side changes, the container always listens on 8080.
    ports:
      - "127.0.0.1:${HV_PUBLISH_PORT:-8080}:8080"

    env_file:
      - .env
    environment:
      # Inside the container the data directory is always /data, whatever the
      # host uses.
      HV_DATA_DIR: /data
      HV_HOST: 0.0.0.0
      HV_PORT: "8080"
      # Turns video rendering on. Both containers mount the same volume at
      # /data, so a path in a render request means the same thing to both.
      HV_RENDER_URL: http://hyperframes:8080

    depends_on:
      - hyperframes

    # The SQLite database and the generated audio live here; keep the volume
    # across image rebuilds or you lose every account and every recording.
    volumes:
      - hebrew-voice-data:/data

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The HyperFrames renderer. Optional: without HV_RENDER_URL pointing at it
  # the app hides everything about video, so this service can be removed and
  # nothing else breaks.
  hyperframes:
    build: ./deploy/render
    image: hebrew-voice-renderer:latest
    container_name: hebrew-voice-renderer
    restart: unless-stopped

    # Deliberately NOT published. It renders arbitrary HTML in a browser and
    # must only ever be reachable from the app over the compose network.
    expose:
      - "8080"

    # Chromium writes a lot through shared memory and crashes on the 64MB
    # default, in ways that look like random render failures.
    shm_size: "1gb"

    # The same artifacts volume the app uses: the app writes the composition
    # and the renderer writes the video back, so neither has to stream a large
    # file over HTTP. Both see it at /data, which is what makes the paths in a
    # render request mean the same thing on both sides.
    volumes:
      - hebrew-voice-data:/data

    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hebrew-voice-data:
